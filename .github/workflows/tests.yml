name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The suite mocks Ollama and uses in-memory SQLite, so no MySQL, GPU or
      # model download is needed. Use the CPU-only torch wheel to keep installs fast.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements.txt > requirements-ci.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt pytest

      - name: Run tests
        run: python -m pytest
